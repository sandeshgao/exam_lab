        "apiVersion: apps/v1\n",
        "kind: Deployment\n",
        "metadata:\n",
        "  name: secret-q8\n",
        "  namespace: math\n",
        "  labels:\n",
        "    app: apache\n",
        "spec:\n",
        "  replicas: 1\n",
        "  selector:\n",
        "    matchLabels:\n",
        "      app: apache\n",
        "  template:\n",
        "    metadata:\n",
        "      labels:\n",
        "        app: apache\n",
        "    spec:\n",
        "      containers:\n",
        "      - name: httpd\n",
        "        image: registry.ocp4.example.com:8443/rhscl/httpd-24-rhel7\n",
        "        ports:\n",
        "        - containerPort: 8080\n",
        "        resources:\n",
        "          requests:\n",
        "            memory: \"170Gi\"\n",
        "            cpu: \"250m\"\n",
        "          limits:\n",
        "            memory: \"200Gi\"\n",
        "            cpu: \"1\"\n",
        "---\n",
        "apiVersion: v1\n",
        "kind: Service\n",
        "metadata:\n",
        "  name: secret-q8\n",
        "  namespace: math\n",
        "  labels:\n",
        "    app: apache\n",
        "spec:\n",
        "  selector:\n",
        "    app: Apache\n",
        "  ports:\n",
        "  - protocol: TCP\n",
        "    port: 80\n",
        "    targetPort: 8080"
